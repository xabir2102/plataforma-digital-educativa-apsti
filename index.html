<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso - APSTI</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <img src="img/images (7).png" alt="Logo APSTI" class="login-logo">

            <h1>APSTI</h1>

            <h2>Plataforma Digital Educativa</h2>

            <p class="subtitulo">
                Inicia sesión para ingresar a la plataforma
            </p>

            <form id="loginForm">

                <label for="rol">
                    Tipo de usuario
                </label>

                <select id="rol" required>

    <option value="">
        Seleccione su rol
    </option>

    <option value="administrador">
        👨‍💼 Administrador
    </option>

    <option value="docente">
        👨‍🏫 Docente
    </option>

    <option value="estudiante">
        🎓 Estudiante
    </option>



                </select>


                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese su usuario"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña"
                    required
                >


                <button type="submit">
                    Ingresar
                </button>

                <p id="mensaje"></p>

            </form>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
